# mise configuration for shiioo.raskell.io
# https://mise.jdx.dev

[tools]
zola = "0.23.6"

[tasks.serve]
description = "Start development server"
run = "zola serve --drafts"

[tasks.build]
description = "Build the website into public/"
run = "zola build"

[tasks.check]
description = "Build the site and check internal links"
run = "zola check --skip-external-links"

[tasks.brand]
description = "Copy the brand assets from ../shiioo and derive icons and the social card (needs ImageMagick)"
run = "scripts/sync-brand.sh"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf public"
